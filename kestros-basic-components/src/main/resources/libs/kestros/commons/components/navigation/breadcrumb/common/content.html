<sly data-sly-use.crumb="${'io.kestros.cms.components.basic.core.navigation.breadcrumbs.BreadCrumbDataSourceComponent'}"/>

<li id="${crumb.id}"
    class="${crumb.inlineVariations} ${crumb.firstItem ? 'first-crumb' : ''} ${crumb.lastItem ? 'last-crumb' : ''}">
    <a
            href="${crumb.href @ context='uri'}"
            target="${crumb.targetAsString}"
            aria-label="${crumb.ariaLabel}"
            aria-disabled="${crumb.disabled}"
            title="${crumb.title}">${crumb.text}</a>
</li>
