<sly data-sly-use.tabs="${'io.kestros.cms.components.basic.core.structure.tabs.TabsDataSourceComponent'}"/>

<div class="tabs ${tabs.inlineVariations}">
    <div class="tab-headers">
        <sly data-sly-list.tabHeader="${tabs.tabHeaders}">
            <p>header</p>
            <p>${tabHeader.path}</p>
            <p>${tabHeader.valueMap}</p>
            <sly data-sly-resource="${tabHeader}"/>
        </sly>
    </div>
    <div class="tab-contents">
        <sly data-sly-list.tabContent="${tabs.tabContents}">
            <sly data-sly-resource="${tabContent}"/>
        </sly>
    </div>
</div>
